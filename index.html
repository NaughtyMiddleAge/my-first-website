        
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

</head>
<link rel="stylesheet" href="style.css">
<body>

        <header>
            <h2>MY FIRST WEBSITE</h2>
        
            <nav>
                <a href="index.html">홈</a>
                <a href="about.html">사이트 소개</a>
            </nav>
        </header>

          <section class="hero">
        <h1>WELCOME!</h1>
        <p>나만의 첫 번째 웹사이트에 오신 것을 환영합니다.</p>
        <button class="btn" onclick="showMessage()">
        공지사항 보기
        </button>
    </section>

    <main class="container">

        <div class="card-wrap">

            <div class="card" id="notice">
                <h2>공지사항</h2>

                <input
                    type="text"
                    id="notice-search"
                    placeholder="공지사항 검색..."
                >

                <div id="notice-list"></div>
                <div id="notice-detail" style="display: none;">

                <h3 id="detail-title"></h3>

                <p id="detail-info"></p>

                <hr>

                <p id="detail-content"></p>

                <button class="btn" onclick="backToList()">
                    목록으로 돌아가기
                </button>

                </div>
                <a href="#notice" class="btn">자세히 보기</a>
            </div>

            <div class="card">
                <h2>일정 안내</h2>
                <p>주요 일정을 이곳에서 확인할 수 있습니다.</p>
                <a href="#schedule" class="btn">일정 확인</a>
            </div>

        </div>

        <div class="card" id="schedule" style="margin-top: 20px;">
            <h2>ABOUT THIS WEBSITE</h2>
            <p>HTML과 CSS를 활용하여 제작한 첫 번째 웹사이트입니다.</p>
        </div>

    </main>

    <footer>
        <p>© 2026 My First Website</p>
    </footer>

    <script>

    function showMessage() {
        alert("공지사항을 확인합니다!");
    }
    
       // 공지사항 데이터
        const notices = [
            {
                title: "홈페이지 오픈 안내",
                date: "2026-11-12",
                category: "일반",
                important: false,
                content: "안녕하세요. 홈페이지 오픈을 안내드립니다. 앞으로 다양한 소식과 정보를 이곳에서 확인하실 수 있습니다."
            },
            {
                title: "서비스 이용 안내",
                date: "2026-11-10",
                category: "안내",
                important: false,
                content: "홈페이지에서 제공하는 주요 서비스의 이용 방법을 안내드립니다. 메뉴를 통해 원하는 정보를 확인하실 수 있습니다."
            },
            {
                title: "정기 점검 안내",
                date: "2026-11-08",
                category: "중요",
                important: true,
                content: "보다 안정적인 서비스 제공을 위해 정기 점검을 진행합니다. 점검 시간에는 일부 서비스 이용이 제한될 수 있습니다."
            }
        ];

        // 공지사항을 표시할 영역
        const noticeList = document.getElementById("notice-list");

        // 검색창 가져오기
        const searchInput = document.getElementById("notice-search");

        // 공지사항을 화면에 표시하는 함수
        function displayNotices(data) {
        
            noticeList.innerHTML = "";
        
            // 중요 공지 우선, 그 다음 최신 날짜순 정렬
            const sortedNotices = [...data].sort(function(a, b) {
        
                if (a.important !== b.important) {
                    return Number(b.important) - Number(a.important);
                }
        
                return new Date(b.date) - new Date(a.date);
        
            });
        
            sortedNotices.forEach(function(notice) {
        
                const item = document.createElement("div");
                item.className = "notice-item";
        
                const title = document.createElement("strong");
        
                // 중요 공지 표시
                if (notice.important) {
                    title.textContent = "[중요] " + notice.title;
                    title.style.color = "#dc2626";
                } else {
                    title.textContent = notice.title;
                    title.style.color = "#2563eb";
                }
        
                title.style.cursor = "pointer";
        
                title.addEventListener("click", function() {
                    showDetail(notice);
                });
        
                const info = document.createElement("p");
                info.textContent = notice.date + " · " + notice.category;
        
                item.appendChild(title);
                item.appendChild(info);
        
                noticeList.appendChild(item);
        
            });
        
        }

        // 공지사항 상세 내용 표시
        function showDetail(notice) {
        
        document.getElementById("notice-list").style.display = "none";
        document.getElementById("notice-search").style.display = "none";
        
        document.getElementById("detail-title").textContent = notice.title;
        document.getElementById("detail-info").textContent =
            notice.date + " · " + notice.category;
        
        document.getElementById("detail-content").textContent =
            notice.content;
        
        document.getElementById("notice-detail").style.display = "block";
        
        }

        // 공지사항 목록으로 돌아가기
        function backToList() {
        
            document.getElementById("notice-detail").style.display = "none";
            document.getElementById("notice-list").style.display = "block";
            document.getElementById("notice-search").style.display = "block";
        
        }

        // 검색 기능
        searchInput.addEventListener("input", function() {

            const keyword = searchInput.value.toLowerCase();

            const filteredNotices = notices.filter(function(notice) {

                return (
                    notice.title.toLowerCase().includes(keyword) ||
                    notice.category.toLowerCase().includes(keyword)
                );

            });

            displayNotices(filteredNotices);

        });

        // 최초 화면에 전체 공지사항 표시
        displayNotices(notices);
   
    </script>    
    
</body>
</html>
