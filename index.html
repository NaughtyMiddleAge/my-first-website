        
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        /* 전체 페이지 기본 설정 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6fa;
            color: #333333;
        }

        /* 상단 메뉴 */
        header {
            background-color: #172554;
            color: white;
            padding: 20px 40px;
        }

        header h2 {
            margin: 0;
        }

        /* 메인 영역 */
        .hero {
            background-color: #1e40af;
            color: white;
            padding: 70px 40px;
            text-align: center;
        }

        .hero h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 17px;
            color: #dbeafe;
        }

        /* 콘텐츠 영역 */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* 카드 배치 */
        .card-wrap {
            display: flex;
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            flex: 1;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .card h2 {
            color: #1e40af;
        }

        /* 버튼 */
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 12px 22px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        /* 공지사항 목록 */
        .notice-item {
            padding: 15px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .notice-item strong {
            display: block;
            margin-bottom: 6px;
        }

        .notice-item p {
            margin: 0;
            color: #888888;
            font-size: 13px;
        }
        /* 공지사항 상세 보기 */
        #notice-detail {
            margin-top: 20px;
        }

        #detail-title {
            color: #1e40af;
        }

        #detail-info {
            color: #888888;
            font-size: 13px;
        }

        #detail-content {
            line-height: 1.8;
            min-height: 100px;
            white-space: pre-line;
        }

        /* 하단 */
        footer {
            background-color: #172554;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 60px;
        }

        /* 모바일 화면 대응 */
        @media (max-width: 650px) {
            header {
                padding: 20px;
            }

            .hero {
                padding: 50px 20px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .card-wrap {
                flex-direction: column;
            }
        }

        /* 공지사항 검색창 */
        #notice-search {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #dddddd;
            border-radius: 6px;
            font-size: 14px;
        }

        #notice-search:focus {
            outline: none;
            border-color: #2563eb;
        }
    </style>
</head>

<body>

    <header>
        <h2>MY FIRST WEBSITE</h2>
    </header>

    <section class="hero">
        <h1>WELCOME!</h1>
        <p>나만의 첫 번째 웹사이트에 오신 것을 환영합니다.</p>
        <button class="btn" onclick="showMessage()">
        공지사항 보기
        </button>
    </section>

    <main class="container">

        <div class="card-wrap">

            <div class="card" id="notice">
                <h2>공지사항</h2>

                <input
                    type="text"
                    id="notice-search"
                    placeholder="공지사항 검색..."
                >

                <div id="notice-list"></div>
                <div id="notice-detail" style="display: none;">

                <h3 id="detail-title"></h3>

                <p id="detail-info"></p>

                <hr>

                <p id="detail-content"></p>

                <button class="btn" onclick="backToList()">
                    목록으로 돌아가기
                </button>

                </div>
                <a href="#notice" class="btn">자세히 보기</a>
            </div>

            <div class="card">
                <h2>일정 안내</h2>
                <p>주요 일정을 이곳에서 확인할 수 있습니다.</p>
                <a href="#schedule" class="btn">일정 확인</a>
            </div>

        </div>

        <div class="card" id="schedule" style="margin-top: 20px;">
            <h2>ABOUT THIS WEBSITE</h2>
            <p>HTML과 CSS를 활용하여 제작한 첫 번째 웹사이트입니다.</p>
        </div>

    </main>

    <footer>
        <p>© 2026 My First Website</p>
    </footer>

    <script>

    function showMessage() {
        alert("공지사항을 확인합니다!");
    }
    
        // 공지사항 데이터
        const notices = [
            {
                title: "홈페이지 오픈 안내",
                date: "2026-11-12",
                category: "일반",
                content: "안녕하세요. 홈페이지 오픈을 안내드립니다. 앞으로 다양한 소식과 정보를 이곳에서 확인하실 수 있습니다."
            },
            {
                title: "서비스 이용 안내",
                date: "2026-11-10",
                category: "안내",
                content: "홈페이지에서 제공하는 주요 서비스의 이용 방법을 안내드립니다. 메뉴를 통해 원하는 정보를 확인하실 수 있습니다."
            },
            {
                title: "정기 점검 안내",
                date: "2026-11-08",
                category: "중요",
                content: "보다 안정적인 서비스 제공을 위해 정기 점검을 진행합니다. 점검 시간에는 일부 서비스 이용이 제한될 수 있습니다."
            }
        ];

        // 공지사항을 표시할 영역
        const noticeList = document.getElementById("notice-list");

        // 검색창 가져오기
        const searchInput = document.getElementById("notice-search");

        // 공지사항을 화면에 표시하는 함수
        function displayNotices(data) {
        
            noticeList.innerHTML = "";
        
            data.forEach(function(notice) {
        
                const item = document.createElement("div");
                item.className = "notice-item";
        
                const title = document.createElement("strong");
                title.textContent = notice.title;
        
                // 제목을 클릭하면 상세 내용 열기
                title.style.cursor = "pointer";
                title.style.color = "#2563eb";
        
                title.addEventListener("click", function() {
                    showDetail(notice);
                });
        
                const info = document.createElement("p");
                info.textContent = notice.date + " · " + notice.category;
        
                item.appendChild(title);
                item.appendChild(info);
        
                noticeList.appendChild(item);
        
            });
        
        }

        // 공지사항 상세 내용 표시
        function showDetail(notice) {
        
        document.getElementById("notice-list").style.display = "none";
        document.getElementById("notice-search").style.display = "none";
        
        document.getElementById("detail-title").textContent = notice.title;
        document.getElementById("detail-info").textContent =
            notice.date + " · " + notice.category;
        
        document.getElementById("detail-content").textContent =
            notice.content;
        
        document.getElementById("notice-detail").style.display = "block";
        
        }

        // 공지사항 목록으로 돌아가기
        function backToList() {
        
            document.getElementById("notice-detail").style.display = "none";
            document.getElementById("notice-list").style.display = "block";
            document.getElementById("notice-search").style.display = "block";
        
        }

        // 검색 기능
        searchInput.addEventListener("input", function() {

            const keyword = searchInput.value.toLowerCase();

            const filteredNotices = notices.filter(function(notice) {

                return (
                    notice.title.toLowerCase().includes(keyword) ||
                    notice.category.toLowerCase().includes(keyword)
                );

            });

            displayNotices(filteredNotices);

        });

        // 최초 화면에 전체 공지사항 표시
        displayNotices(notices);
   
    </script>    
    
</body>
</html>
